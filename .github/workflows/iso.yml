name: ISO

# Build the COMPLETE Sysible Server ISO on GitHub's runners, whose network is not
# HTTPS-inspected, so every vendor tool (Docker, Kubernetes, Terraform, cloud
# CLIs, VS Code) bakes in. Download the finished .iso from the run's Artifacts,
# or — on a version tag (v*) — from the published GitHub Release.
on:
  workflow_dispatch:          # run it manually from the Actions tab
    inputs:
      arch:
        description: 'Target architecture'
        type: choice
        options: [amd64, arm64]
        default: amd64
      release:
        description: 'Publish a GitHub Release (split ISO + checksums)'
        type: boolean
        default: false
      tag:
        description: 'Release tag to create/use (only when release=true)'
        type: string
        default: v0.1.0
  push:
    tags: ['v*']              # and on release tags (amd64)

permissions:
  contents: write             # needed to create the Release on a tag

jobs:
  # ---------------------------------------------------------------------------
  # Build the platform's container images HERE, where there is a network and a
  # Docker daemon, so the installed machine needs neither.
  #
  # WHY THIS EXISTS. The platform used to be BUILT FROM SOURCE on the operator's
  # host on first boot. Every one of those builds fetched from PyPI, npm, Debian
  # and Alpine, so a host that could not reach them could not finish an install
  # the installer itself had offered. Reported from a machine whose resolver
  # could not answer for auth.docker.io:
  #
  #   target baseline: failed to solve: failed to fetch anonymous token:
  #     ... lookup auth.docker.io on 172.16.100.2:53: no such host
  #
  # Baking the base images got that machine as far as the first `pip install`
  # and no further. Shipping the FINISHED images is what makes an airgapped
  # install work, and it is only possible where there is a builder — here.
  #
  # WHY A SEPARATE JOB: the iso job runs inside a debian:bookworm container with
  # no Docker daemon, so it cannot build images. This one runs on the bare
  # runner, where Docker is already up.
  app-images:
    runs-on: ${{ (github.event.inputs.arch == 'arm64') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      # SLOP is the source of truth for every app: it VENDORS the Controller,
      # SLEP and Connect under apps/ (see apps/VENDORED.json), so one checkout
      # builds all eight service images rather than four clones that can drift.
      - name: Check out the platform
        uses: actions/checkout@v4
        with:
          repository: sysiblesoftware/sysible-linux-operations-platform
          path: slop

      - name: Build every service image
        # compose interpolates the WHOLE file before building, so a variable
        # marked required (${VAR:?...}) stops a build that never uses it. The
        # first run of this job died on
        #   required variable SYSIBLE_SSO_SHARED_SECRET is missing a value
        # having built nothing.
        #
        # A placeholder is safe HERE and only here: that variable appears solely
        # under `environment:`, never under `args:`, so it is a runtime value and
        # never enters an image layer. The real secret is minted per host by
        # install.sh, which is what makes SSO between the apps trustworthy. The
        # guard below is what keeps that true.
        env:
          SYSIBLE_SSO_SHARED_SECRET: build-time-placeholder-not-a-secret
        run: |
          set -euo pipefail
          cd slop
          # If a required variable ever becomes a BUILD ARG, the placeholder below
          # would be baked into an image layer and shipped as if it were a real
          # secret. Read the RENDERED config and inspect build args ONLY -- grepping
          # the file cannot tell a build arg from an environment value.
          # --profile integrated: the Controller, SLEP and Connect are declared under
          # that profile, and compose SKIPS a profiled service unless it is asked for.
          # Without it the five SLOP-native images build, the three apps do not, and
          # `docker save` is the first thing to notice -- which is how the second run
          # of this job failed: "No such image: sysible-controller:latest".
          docker compose -f docker-compose.yml --profile integrated config --format json > /tmp/rendered.json
          python3 - <<'PYGUARD'
          import json, sys
          d = json.load(open("/tmp/rendered.json"))
          bad = []
          for name, svc in (d.get("services") or {}).items():
              b = svc.get("build")
              args = (b.get("args") or {}) if isinstance(b, dict) else {}
              vals = args.values() if isinstance(args, dict) else args
              if any("placeholder-not-a-secret" in str(v) for v in vals):
                  bad.append(name)
          if bad:
              sys.exit("ERROR: the build-time placeholder reached a BUILD ARG in %s. "
                       "It would be baked into the image and shipped as a secret." % bad)
          print("build args carry no placeholder: the secret stays a runtime value")
          PYGUARD
          docker compose -f docker-compose.yml --profile integrated build --pull
          docker image ls

      - name: Pull the images that are run rather than built
        # caddy is the gateway itself — a plain `image:` in the compose file with
        # no build of its own. Missing it means every app builds and there is
        # still no front door.
        run: docker pull caddy:2-alpine

      - name: Save them all into ONE archive
        # One `docker save` of every image, not one per image. A single archive
        # stores shared layers once, and every Python service shares the whole
        # python:3.12-slim base — saved separately it would ship eight times.
        run: |
          set -euo pipefail
          mkdir -p out
          docker save -o out/sysible-images.tar \
            sysible-slop-idp sysible-flashback sysible-baseline \
            sysible-visualizer sysible-slop-updater \
            sysible-controller:latest sysible-slep:latest sysible-connect:latest \
            caddy:2-alpine
          ls -lh out/sysible-images.tar

      - uses: actions/upload-artifact@v4
        with:
          name: app-images-${{ github.event.inputs.arch || 'amd64' }}
          path: out/sysible-images.tar
          retention-days: 1
          compression-level: 0   # already-compressed layers; recompressing costs minutes and saves nothing

  iso:
    # arm64 builds run on a native ARM runner (free for public repos); amd64 and
    # tag pushes use the standard x86 runner.
    needs: app-images
    runs-on: ${{ (github.event.inputs.arch == 'arm64') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 120
    container:
      image: debian:bookworm
      options: --privileged   # live-build needs mount/loop/chroot
    env:
      SYSIBLE_ARCH: ${{ github.event.inputs.arch || 'amd64' }}
    steps:
      - name: Prereqs for checkout
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      # Fail FAST (seconds, not 35 minutes) if any logo asset drifted from the
      # canonical mark — e.g. the mark was changed but the boot/GRUB/Plymouth PNGs
      # weren't regenerated. Pure sha256 check, no rendering, so it needs no extra
      # deps and can't false-positive on toolchain differences.
      # The finished images, built by the job above. They go into the chroot so
      # an installed machine can bring the whole platform up with no registry.
      - name: Collect the prebuilt platform images
        uses: actions/download-artifact@v4
        with:
          name: app-images-${{ github.event.inputs.arch || 'amd64' }}
          path: live-build/config/includes.chroot/usr/share/sysible/app-images

      # The SOURCE as well, not only the images. compose needs its own file and
      # the .env beside it, sysiblectl discovers products by their checkout, and
      # `install-sysible` git-cloned all of this from GitHub -- which is the
      # other thing an airgapped host cannot do.
      - name: Ship the platform source
        uses: actions/checkout@v4
        with:
          repository: sysiblesoftware/sysible-linux-operations-platform
          path: live-build/config/includes.chroot/opt/sysible-src/sysible-linux-operations-platform

      - name: Confirm both actually arrived
        # An ISO that ships neither still builds, boots, and fails at the end of
        # the install -- the worst place to find out. Fail here instead.
        run: |
          set -eu
          img=live-build/config/includes.chroot/usr/share/sysible/app-images/sysible-images.tar
          src=live-build/config/includes.chroot/opt/sysible-src/sysible-linux-operations-platform
          [ -s "$img" ] || { echo "ERROR: the prebuilt image archive is missing or empty." >&2; exit 1; }
          [ -f "$src/docker-compose.yml" ] || { echo "ERROR: the platform source did not ship." >&2; exit 1; }
          echo "images: $(du -h "$img" | cut -f1)   source: $(du -sh "$src" | cut -f1)"
          # KEEP .git. install-sysible recognises an existing checkout by it and
          # then runs `git pull --ff-only || true` -- which refreshes a networked
          # host and is a harmless no-op on an isolated one. Without it the
          # checkout looks like a stray directory and the clone fails on a
          # non-empty target.

      - name: Verify branding is in sync
        run: sh scripts/verify-branding.sh

      - name: Build the ISO
        run: |
          cd live-build
          # Keep the build's own output, because the only part of a job log
          # readable through the API is its tail, and the diagnostics step
          # below is long enough to push the real error out of it.
          #
          # No `| tee` and no `set -o pipefail`: this runs under `sh -e`, where
          # pipefail is an illegal option that -e turns into an instant failure,
          # and without pipefail a pipe would report tee's exit status and make
          # every failed build look green. Redirect, then replay, then exit with
          # the build's own status -- works the same in sh and bash.
          # `|| rc=$?` and not `; rc=$?`: under -e a bare failing command aborts
          # the step on the spot, so the replay below never ran and a failed
          # build left NO output in the job log at all. A || list is exempt.
          rc=0
          ./build.sh > /tmp/sysible-build.log 2>&1 || rc=$?
          cat /tmp/sysible-build.log
          exit $rc

      # The one thing a failed build could not tell anyone. A dependency failure
      # lands ~4 minutes in, and the lines that say WHY -- whether the vendor
      # repo was written, whether its key was trusted, whether apt could reach
      # it -- are thousands of lines earlier, where nothing reading the tail of
      # the log will ever see them. This prints that state at the END, on
      # failure only, so the reason is wherever the reader is.
      - name: Why the build failed (diagnostics)
        if: failure()
        run: |
          cd live-build
          echo "=== config/archives (vendor repos, added BEFORE packages install) ==="
          ls -la config/archives/ 2>&1 || echo "  MISSING — nothing configured the vendor repos"
          for f in config/archives/*.list.chroot; do
            [ -e "$f" ] && { echo "--- $f ---"; cat "$f"; }
          done 2>/dev/null
          for f in config/archives/*.key.chroot; do
            [ -e "$f" ] && { echo "--- $f ---"; file -b "$f"; head -c 40 "$f"; echo; }
          done 2>/dev/null
          echo
          echo "=== did any of it reach the chroot? ==="
          ls -la chroot/etc/apt/sources.list.d/ 2>&1 | head -20
          cat chroot/etc/apt/sources.list.d/docker.list 2>&1 || echo "  no docker.list in the chroot"
          ls -la chroot/etc/apt/trusted.gpg.d/ 2>&1 | head -20
          echo
          echo "=== what apt in the chroot thinks of docker-ce ==="
          chroot chroot apt-cache policy docker-ce 2>&1 | head -20 || echo "  (could not query the chroot)"
          echo
          echo "=== did the CA store survive to the failure? ==="
          # Distinguishes the two ways the staged CA fix can come apart. The
          # bundle is planted after `lb bootstrap`; if `lb build` re-ran
          # debootstrap instead of honouring the .build/bootstrap stamp, it
          # wiped the chroot and the bundle with it. Present-but-still-failing
          # means something other than trust is wrong.
          if [ -s chroot/etc/ssl/certs/ca-certificates.crt ]; then
            echo "  present: $(grep -c 'END CERTIFICATE' chroot/etc/ssl/certs/ca-certificates.crt) CAs -- trust was NOT the problem this time"
          elif [ -d chroot ]; then
            echo "  GONE but chroot/ exists -- the bundle was removed or never landed"
          else
            echo "  no chroot/ at all -- the build died before or during bootstrap"
          fi
          ls -la .build/ 2>&1 | head -12
          echo
          echo "=== apt lists: was the Docker index ever fetched? ==="
          ls chroot/var/lib/apt/lists/ 2>/dev/null | grep -i docker || echo "  NO docker index — the repo was never fetched"
          echo
          echo "=== run apt-get update IN the chroot and see what it says about Docker ==="
          # This is the question the last run could not answer: the repo line and
          # the key are both in place, yet apt holds no index for it. Either the
          # update never ran after they landed, or it ran and rejected the repo.
          # Asking apt directly is the only thing that distinguishes the two.
          cp /etc/resolv.conf chroot/etc/resolv.conf 2>/dev/null || true
          chroot chroot apt-get update 2>&1 | grep -iE "docker|^Err|^W:|^E:|NO_PUBKEY|not signed" | head -30 \
            || echo "  (apt-get update produced no Docker-related output at all)"
          echo "--- and now? ---"
          chroot chroot apt-cache policy docker-ce 2>&1 | head -8
          echo
          # LAST, deliberately. Only the end of a job log is readable through the
          # API -- the full log lives in blob storage that is not reachable from
          # everywhere -- so the single most important thing has to be printed
          # last. Three failures in a row were diagnosed from state dumps alone
          # because the line that named the failing stage had scrolled out of
          # reach, and one of them could not be diagnosed at all.
          echo "=== the end of the build itself, which is where it actually died ==="
          tail -60 /tmp/sysible-build.log 2>/dev/null \
            || echo "  (no build log -- the build step did not get as far as writing one)"

      - name: Name the ISO
        # live-build emits a generic live-image-<arch>.hybrid.iso; rename it to the
        # product name so the artifact, the release parts, and the file a user
        # downloads are all sysible-server-<arch>.iso (not the generic live image).
        run: |
          cd live-build
          iso=$(ls *.iso | head -1)
          out="sysible-server-${SYSIBLE_ARCH}.iso"
          [ "$iso" = "$out" ] || mv -v "$iso" "$out"
          ls -lh "$out"

      - name: Show result
        run: ls -lh live-build/*.iso

      - name: Upload ISO (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: sysible-server-${{ env.SYSIBLE_ARCH }}-iso
          path: live-build/*.iso
          if-no-files-found: error
          compression-level: 0
          # ISO artifacts are multi-GB; expire them quickly so old dev builds
          # don't pile up in the account's Actions storage. Rebuild any time from
          # the run's commit; published releases (softprops/action-gh-release
          # below) are unaffected — they live in Releases, not Actions artifacts.
          retention-days: 7

      # ---- release-only steps (tag push, or a dispatch with release=true) --
      - name: Split ISO for release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        run: |
          set -e
          apt-get install -y --no-install-recommends coreutils
          A="${SYSIBLE_ARCH:-amd64}"     # arch-suffix shared-name files
          mkdir -p release
          ISO=$(ls live-build/*.iso | head -1)
          BASE=$(basename "$ISO")
          cd release
          # Full-image checksum, for verifying AFTER reassembly.
          sha256sum -b "../$ISO" | sed "s| .*| *$BASE|" > "SHA256SUMS.$A"
          # GitHub release assets cap at 2 GiB, so split into 1900 MiB parts.
          split -b 1900M -d --additional-suffix=.part "../$ISO" "$BASE."
          # Per-part checksums, for verifying the downloads BEFORE reassembly.
          sha256sum -b "$BASE".*.part > "SHA256SUMS.$A.parts"
          cat > "REASSEMBLE.$A.md" <<EOF
          # Sysible Server ($A) — reassemble the ISO

          The ISO is ~3.4 GB, over GitHub's 2 GB per-file release limit, so it is
          split into \`$BASE.*.part\` pieces.

          Download every \`$BASE.*.part\`, plus \`SHA256SUMS.$A\`,
          \`SHA256SUMS.$A.parts\` and their \`.gpg\` signatures, into one folder.

          First verify AUTHENTICITY with the Sysible release key (fingerprint
          published at https://sysible.com/security), then the checksums:

          \`\`\`sh
          gpg --verify SHA256SUMS.$A.parts.gpg SHA256SUMS.$A.parts  # authenticity
          sha256sum -c SHA256SUMS.$A.parts     # verify the downloaded parts
          cat $BASE.*.part > $BASE             # reassemble
          gpg --verify SHA256SUMS.$A.gpg SHA256SUMS.$A              # authenticity
          sha256sum -c SHA256SUMS.$A           # verify the whole ISO
          \`\`\`

          Then write \`$BASE\` to a USB stick (\`dd\`, Etcher, Rufus) and boot it.
          The live session logs in automatically; the installer creates your own
          account and password (no default login ships in the image).
          EOF
          ls -lh

      # Sign the checksum manifests with the Sysible release key so the download
      # has an AUTHENTICITY anchor, not just an integrity check. Without this,
      # anyone able to alter the release assets swaps the ISO AND the checksums
      # together and `sha256sum -c` still passes. The `SHA256SUMS.*` glob in the
      # publish step already picks up the resulting `.gpg` files.
      # NOTE: ideally the release key is applied OFFLINE (hardware token) rather
      # than injected into this privileged build container; this in-CI signing is
      # the minimum bar. Fails closed if the key is absent.
      - name: Sign the checksum manifests
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        env:
          SYSIBLE_GPG_PRIVATE_KEY: ${{ secrets.SYSIBLE_GPG_PRIVATE_KEY }}
        run: |
          set -e
          if [ -z "$SYSIBLE_GPG_PRIVATE_KEY" ]; then
            echo "::error::SYSIBLE_GPG_PRIVATE_KEY is not set — a public release must ship signed checksums."
            exit 1
          fi
          apt-get install -y --no-install-recommends gnupg
          GNUPGHOME="$(mktemp -d)"; export GNUPGHOME; chmod 700 "$GNUPGHOME"
          printf '%s' "$SYSIBLE_GPG_PRIVATE_KEY" | gpg --batch --import
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/{print $5; exit}')
          cd release
          for f in SHA256SUMS.*; do
            case "$f" in *.gpg) continue ;; esac
            gpg --batch --yes --local-user "$KEYID" --armor --detach-sign -o "$f.gpg" "$f"
            gpg --batch --verify "$f.gpg" "$f"
          done
          gpgconf --kill all 2>/dev/null || true
          rm -rf "$GNUPGHOME"
          ls -l

      # SECURITY TODO: pin this third-party action to a full commit SHA (it holds
      # contents:write). It is left at the mutable @v2 tag only because the SHA
      # must be resolved and reviewed on a trusted network — do that before the
      # public release: `uses: softprops/action-gh-release@<40-char-sha>  # v2.x`.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          # On a tag push, use that tag; on a dispatch, create/use inputs.tag
          # at the checked-out commit (action creates the tag if it's new).
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          name: Sysible Server ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          files: |
            release/*.part
            release/SHA256SUMS.*
            release/REASSEMBLE.*.md
          # A fixed, clean body. amd64 and arm64 publish to the same tag, so keep
          # append_body off and don't auto-generate notes (that appended a
          # duplicate changelog line on every publish).
          generate_release_notes: false
          append_body: false
          body: |
            **Sysible Server** — the headless engineering platform.

            A live Debian-stable image with the whole server toolchain baked in:
            containers, Kubernetes, infrastructure-as-code, cloud CLIs, headless
            libvirt/QEMU and the modern CLI set — installed with the Debian
            Installer. No GNOME desktop, no GUI apps — the full engineering
            toolset, headless.
            Includes the Sysible Controller CE installer.

            ### New in ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
            * **Choosing software during the install now installs it.** Ticking `slop`
              — or any one app — recorded the choice and then, on a host that could not
              reach GitHub and Docker Hub, did nothing with it: the first-boot installer
              checked for a network before it looked at the disk, gave up after three
              tries and left a note at the login prompt. The container images and the
              platform's source were already on the machine. That check now runs only
              when something genuinely needs downloading, so what you tick during the
              install is running when you first log in — no command to type, and no
              network required.
            * **Nothing is fetched that the image already ships.** The apps are taken
              from the platform checkout in the image, which carries all three of them,
              rather than cloned from GitHub a second time. A host that did clone them
              keeps using its own checkout, so `sysiblectl <product> update` goes on
              tracking the repository you cloned.
            * **A host that really is just offline still gets the old, clear message.**
              The network check was made conditional, not removed. Source without the
              images still has to reach a registry, so that case keeps the check rather
              than failing later inside a build.

            **Earlier, in 1.0.7 — the airgapped install.**
            * **The platform installs on an airgapped network.** The ISO now
              carries every Sysible container image, built beforehand, plus the
              platform's source. A first boot loads them and brings the whole
              stack up without reaching a registry, a package index or GitHub.
              It used to build each service from source on your machine, and
              every one of those builds fetched from PyPI, npm, Debian and
              Alpine — so a host that could not reach them could not finish an
              install this installer had offered.
            * **Nothing rebuilds what the image already carries.** The first
              bring-up starts from the shipped images and builds only what is
              genuinely missing, so it is minutes rather than tens of minutes.
            * **A build that cannot reach its registry says so immediately.**
              It used to spend the time first and then print a buildkit trace
              whose one useful line was that DNS had failed.
            * **`sudo install-sysible` no longer clones what the image already
              has**, and `sysiblectl update` says plainly that an isolated host
              moves versions by installing a newer ISO rather than failing on a
              `git pull`.
            * **The sign-in is written down.** The platform's first sign-in is
              `admin` / `sysible` — the shipped default, public, and changed at
              `/account`. The machine now prints it at login, and it is in the
              manuals.

            ### Downloads (amd64 & arm64)
            The ISO is ~3.4 GB, over GitHub's 2 GB per-file limit, so each build ships
            as numbered `*.part` files. Download every `*.part` for your architecture
            plus the two `SHA256SUMS.<arch>*` files, then reassemble:

            ```sh
            gpg --verify SHA256SUMS.<arch>.parts.gpg SHA256SUMS.<arch>.parts  # authenticity
            sha256sum -c SHA256SUMS.<arch>.parts   # verify the parts
            cat sysible-server-<arch>.iso.*.part > sysible-server-<arch>.iso
            gpg --verify SHA256SUMS.<arch>.gpg SHA256SUMS.<arch>              # authenticity
            sha256sum -c SHA256SUMS.<arch>          # verify the whole ISO
            ```

            Verify authenticity with the Sysible release key (fingerprint at
            https://sysible.com/security) before trusting the checksums. See
            `REASSEMBLE.<arch>.md` for exact commands. The live session logs in
            automatically; the installer creates your own account — no default
            login ships in the image.
          fail_on_unmatched_files: true

      # Poke the website so its download page updates to this release right away.
      # Optional: set the WEBSITE_DISPATCH_TOKEN secret (a fine-grained PAT with
      # "Contents: write" on sysiblesoftware/sysible-website) to enable it. If the
      # secret is absent this is a no-op — the website's own 6-hourly sync still
      # catches the new release.
      - name: Notify website of new release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        env:
          WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "${WEBSITE_DISPATCH_TOKEN:-}" ]; then
            echo "WEBSITE_DISPATCH_TOKEN not set — skipping. The website syncs itself every 6h."
            exit 0
          fi
          curl -sSL --fail -X POST \
            -H "Authorization: Bearer $WEBSITE_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/sysiblesoftware/sysible-website/dispatches \
            -d '{"event_type":"iso-released"}'

  # Push the Sysible packages to the apt repo's STABLE suite whenever a release
  # is cut, in the same run. Without this the suite is only ever updated by a
  # push to main, which publishes to DEV -- so an installed Server on the stable
  # channel never saw a release's packages at all. See the long note at the top
  # of publish.yml for why the `tags: ['v*']` trigger there cannot do this job.
  publish-apt:
    needs: iso
    # Only for a release, and only ONCE -- a dispatch runs this workflow per
    # arch, and the packages are Architecture: all, so amd64 carries it. A tag
    # push produces a single run, which has no inputs.arch at all.
    if: >-
      (startsWith(github.ref, 'refs/tags/') || inputs.release) &&
      (github.ref_type == 'tag' || inputs.arch == 'amd64')
    uses: ./.github/workflows/publish.yml
    with:
      suite: stable
    secrets: inherit
