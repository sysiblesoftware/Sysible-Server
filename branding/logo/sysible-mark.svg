<?xml version="1.0" encoding="UTF-8"?>
<!-- Sysible Server mark — SES rebrand. Dark tile + green ring + stacked RACK
     UNITS + short green underline.
     The glyph used to be the Sora "S", which Sysible Workstation also used: the
     two product marks were byte-identical apart from one word in this comment,
     so Server and Workstation were distinguishable only by the wordmark set
     beside them. The tile, the ring, the green and the underline are unchanged,
     so the marks still read as one family; only the glyph inside tells them
     apart. Server is headless and racked, so it gets three rack units with a
     lit status LED on each. Font-free vectors, as before. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs><linearGradient id="t" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#18202c"/><stop offset="1" stop-color="#0b0e15"/></linearGradient></defs>
  <rect x="6" y="6" width="116" height="116" rx="27" fill="url(#t)"/>
  <rect x="6" y="6" width="116" height="116" rx="27" fill="none" stroke="#6ddb73" stroke-width="3.5"/>
  <g fill="none" stroke="#eceff3" stroke-width="5">
    <rect x="30" y="28" width="68" height="16" rx="4"/>
    <rect x="30" y="50" width="68" height="16" rx="4"/>
    <rect x="30" y="72" width="68" height="16" rx="4"/>
  </g>
  <g stroke="#5b6573" stroke-width="4.5" stroke-linecap="round">
    <path d="M41 36 H57"/><path d="M41 58 H57"/><path d="M41 80 H57"/>
  </g>
  <circle cx="86" cy="36" r="3.6" fill="#6ddb73"/>
  <circle cx="86" cy="58" r="3.6" fill="#6ddb73"/>
  <circle cx="86" cy="80" r="3.6" fill="#6ddb73"/>
  <rect x="43.2" y="94" width="41.5" height="5" rx="2" fill="#6ddb73"/>
</svg>
