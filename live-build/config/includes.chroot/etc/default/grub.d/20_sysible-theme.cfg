# Sysible-branded GRUB menu. Sourced by grub-mkconfig after /etc/default/grub,
# so it applies on the installed system (the installer runs update-grub on the
# target, which reads this drop-in) without editing the main grub file.
GRUB_THEME="/boot/grub/themes/sysible/theme.txt"
# Prefer 1024x768 — the resolution firmware/VM GOP actually gives the GRUB menu
# (native high-res only arrives once the kernel loads). The theme's logo is sized
# for this, so the installed menu renders at the same modest size as the live ISO
# menu instead of being over- or under-sized at some other resolution.
GRUB_GFXMODE="1024x768,1280x720,auto"
# BLACK SCREEN AFTER GRUB — drive the console the way the INSTALLER already does.
# Confirmed on amd64 under VMware/VirtualBox: the installed server booted to a
# black screen (only the VM's host mouse pointer over an un-driven guest display).
# Two earlier attempts made it WORSE, and knowing why pins the real fix:
#   * gfxpayload=text  — on UEFI there is no text mode to switch to; black.
#   * nomodeset        — this was the mistake. VMware's VMSVGA and VirtualBox's
#                        virtual GPUs have NO usable legacy VESA/EFI framebuffer;
#                        the ONLY thing that lights their display is the KMS/DRM
#                        driver (vmwgfx / vboxvideo / bochs-drm). nomodeset
#                        DISABLES exactly that driver, guaranteeing a black guest.
# The one video path proven to work on this VM is the graphical installer itself:
# it runs with gfxpayload=keep and KMS ENABLED (no nomodeset), and it renders.
# The installed system must use the same path — so let KMS load and drive the
# framebuffer console. Drop `quiet` so the boot is visible (a server console
# should be legible, and a black screen is then diagnosable rather than silent);
# console=tty0 pins the kernel console to the video console. The branded
# graphical MENU is unaffected (GRUB_TERMINAL_OUTPUT=gfxterm, below).
GRUB_GFXPAYLOAD_LINUX="keep"
GRUB_CMDLINE_LINUX_DEFAULT="console=tty0"
GRUB_TERMINAL_OUTPUT="gfxterm"
# Menu entries read "Sysible Server" (not the auto-derived "Sysible"). The
# system hook also patches /etc/grub.d/10_linux to drop the hard-coded
# " GNU/Linux" suffix, so the title is exactly this distributor string (the same
# special-casing Ubuntu does for its own entries).
GRUB_DISTRIBUTOR="Sysible Server"
