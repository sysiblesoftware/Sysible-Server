# Sysible-branded GRUB menu. Sourced by grub-mkconfig after /etc/default/grub,
# so it applies on the installed system (the installer runs update-grub on the
# target, which reads this drop-in) without editing the main grub file.
GRUB_THEME="/boot/grub/themes/sysible/theme.txt"
# Prefer 1024x768 — the resolution firmware/VM GOP actually gives the GRUB menu
# (native high-res only arrives once the kernel loads). The theme's logo is sized
# for this, so the installed menu renders at the same modest size as the live ISO
# menu instead of being over- or under-sized at some other resolution.
GRUB_GFXMODE="1024x768,1280x720,auto"
# BLACK SCREEN AFTER GRUB — the real cause, and why the earlier fix didn't take.
# Symptom: the installed server boots to a black screen (only the VM's mouse
# pointer). We first tried gfxpayload=text; it did NOT help — and on UEFI (every
# modern VM, all of arm64) "text" is actually invalid because there is no VGA
# text mode to switch to, so it can black the screen by itself. Since BOTH "keep"
# and "text" black out, the framebuffer *handoff* isn't the problem: the kernel's
# DRM/KMS driver for the virtual GPU (virtio-gpu / vmwgfx, esp. on arm64 VMs)
# comes up and fails to light the display.
#
# Fix: boot the kernel with `nomodeset` so it uses the firmware framebuffer
# (efifb/simplefb) directly and never loads the DRM driver that goes dark — the
# standard, reliable cure for "black screen after GRUB on a VM". A headless
# server needs no GPU acceleration, so there is no downside. Pair it with
# gfxpayload=keep so GRUB leaves that EFI framebuffer active for the kernel to
# reuse. We also drop `quiet` so boot progress is visible (a server wants its
# console legible, and it makes any future display issue diagnosable instead of
# a silent black screen). The branded graphical MENU is unaffected
# (GRUB_TERMINAL_OUTPUT=gfxterm, below).
GRUB_GFXPAYLOAD_LINUX="keep"
GRUB_CMDLINE_LINUX_DEFAULT="nomodeset"
GRUB_TERMINAL_OUTPUT="gfxterm"
# Menu entries read "Sysible Server" (not the auto-derived "Sysible"). The
# system hook also patches /etc/grub.d/10_linux to drop the hard-coded
# " GNU/Linux" suffix, so the title is exactly this distributor string (the same
# special-casing Ubuntu does for its own entries).
GRUB_DISTRIBUTOR="Sysible Server"
