# Sysible-branded GRUB menu. Sourced by grub-mkconfig after /etc/default/grub,
# so it applies on the installed system (the installer runs update-grub on the
# target, which reads this drop-in) without editing the main grub file.
GRUB_THEME="/boot/grub/themes/sysible/theme.txt"
# Prefer 1024x768 — the resolution firmware/VM GOP actually gives the GRUB menu
# (native high-res only arrives once the kernel loads). The theme's logo is sized
# for this, so the installed menu renders at the same modest size as the live ISO
# menu instead of being over- or under-sized at some other resolution.
GRUB_GFXMODE="1024x768,1280x720,auto"
# HAND THE KERNEL A TEXT CONSOLE, NOT THE MENU'S FRAMEBUFFER.
# "keep" (a desktop setting) makes GRUB pass the kernel the graphical EFI/GOP
# framebuffer it drew the menu with, expecting Plymouth/GDM to take it over. This
# is a HEADLESS server: nothing claims that framebuffer, so on UEFI (incl. VMs)
# the screen goes black right after GRUB — the classic "black screen + stray
# pointer" first boot. "text" switches to a normal text console before the kernel
# loads, so getty's login prompt renders. The branded graphical MENU is
# unaffected (that's GRUB_TERMINAL_OUTPUT=gfxterm, below).
GRUB_GFXPAYLOAD_LINUX="text"
GRUB_TERMINAL_OUTPUT="gfxterm"
# Menu entries read "Sysible Server" (not the auto-derived "Sysible"). The
# system hook also patches /etc/grub.d/10_linux to drop the hard-coded
# " GNU/Linux" suffix, so the title is exactly this distributor string (the same
# special-casing Ubuntu does for its own entries).
GRUB_DISTRIBUTOR="Sysible Server"
