# Sysible Workstation SSH defaults.
#
# SSH is ENABLED by default on Sysible Workstation (a headless image is administered
# remotely) and accepts PASSWORD login by default, so you can reach a fresh box
# immediately with the account + password you chose during install. The image
# ships NO default credentials, so there is nothing pre-known to attack — the
# only way in is the password you set.
#
# To harden further (recommended for anything internet-facing): install your
# public key, then set `PasswordAuthentication no` here (or in a drop-in that
# sorts BEFORE this one, since sshd honours the first value it sees).

# Password auth ON by default. Key-based auth always works too and is preferred.
PasswordAuthentication yes
KbdInteractiveAuthentication no

# root may only log in with a key (never a password), and ideally not at all.
PermitRootLogin prohibit-password

# Never allow empty passwords, and keep the surface minimal.
PermitEmptyPasswords no
X11Forwarding no
