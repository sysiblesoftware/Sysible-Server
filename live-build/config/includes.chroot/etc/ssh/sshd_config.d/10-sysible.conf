# Sysible Server SSH defaults.
#
# SSH is ENABLED by default on Sysible Server (a headless image is administered
# remotely) and accepts PASSWORD login by default, so you can reach a fresh box
# with the account + password you chose during install — no key setup required.
#
# The password surface is defended, not naive: the image ships NO baked/default
# credential (root is locked, the first user's password is set interactively at
# install), and it ships fail2ban (jail.d/sysible.local — bans brute force) and
# pam_pwquality (pwquality.conf.d — refuses trivial passwords) installed and
# active. For a hardened deployment, install your key (`ssh-copy-id sysible@host`)
# and set `PasswordAuthentication no` here to go key-only.
PasswordAuthentication yes

# root may only log in with a key (never a password), and ideally not at all.
PermitRootLogin prohibit-password

# Never allow empty passwords, and keep the surface minimal.
PermitEmptyPasswords no
X11Forwarding no
