# Sysible Server — SSH hardening drop-in (parsed after the main sshd_config).
# A server is reachable over SSH by design, so unlike the Workstation image this
# does NOT force key-only auth (that would lock out a freshly-installed box with
# no keys yet). It removes root login and tightens the login surface. Once your
# authorized_keys are in place, set `PasswordAuthentication no` here.

PermitRootLogin no
PasswordAuthentication yes
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
X11Forwarding no
AllowAgentForwarding no
MaxAuthTries 4
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
