# Sysible Server SSH hardening.
#
# SSH is ENABLED by default on Sysible Server (a headless image is administered
# remotely). These defaults keep the service key-only: it never accepts a
# password over the network, so add your public key (via the console or
# cloud-init) before you rely on remote access.
#
# Override anything here with a later-sorting drop-in in this directory.

# No password / keyboard-interactive auth — public keys only.
PasswordAuthentication no
KbdInteractiveAuthentication no

# root may only log in with a key (never a password), and ideally not at all.
PermitRootLogin prohibit-password

# Don't advertise empty passwords, and keep the surface minimal.
PermitEmptyPasswords no
X11Forwarding no
