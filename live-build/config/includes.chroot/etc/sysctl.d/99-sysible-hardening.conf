# Sysible Server kernel hardening — conservative, broadly-safe server defaults.
# Restrict kernel address / log exposure to non-root.
kernel.kptr_restrict = 1
kernel.dmesg_restrict = 1
# Yama: a process may ptrace only its own descendants.
kernel.yama.ptrace_scope = 1
# Reduce unprivileged BPF attack surface.
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
# Network hygiene: reverse-path filtering, SYN cookies, no ICMP redirects or
# source routing, log martians.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.tcp_syncookies = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv4.conf.all.log_martians = 1
# Keep kernel console chatter OFF the login TTY. log_martians above is a useful audit
# signal, but a noisy LAN (e.g. a router broadcasting packets with an illegal
# 255.255.255.255 source) makes the kernel print a martian warning over the getty
# login prompt on tty0. Lower the console log level so only errors and above reach the
# console; warnings/notices/info still go to the ring buffer + journal (journalctl -k,
# or dmesg for root). Format: console default minimum boot-time loglevels.
kernel.printk = 4 4 1 7
