# Sysible Server — split-terminal defaults (tmux).
#
# tmux is the headless split terminal on Sysible Server (no GUI, so no SysTerm).
# The PREFIX — the key combo you press before any tmux command — is Ctrl+F1.
#
# NOTE on Ctrl+F1: not every terminal emulator sends a distinct sequence for
# Ctrl+F1. If it doesn't register in your terminal, change the two prefix lines
# below to a key that does (e.g. `set -g prefix F1` / `bind F1 send-prefix`, or
# the classic `set -g prefix C-a`). Everything else keeps working regardless.

# --- prefix: Ctrl+F1 -------------------------------------------------------
unbind C-b
set -g prefix C-F1
bind C-F1 send-prefix

# --- splits (press the prefix first) ---------------------------------------
#   Ctrl+F1 then |   → split left/right (vertical divider)
#   Ctrl+F1 then -   → split top/bottom (horizontal divider)
# New panes open in the current pane's directory. %/" still work too.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# --- move / resize panes ---------------------------------------------------
# Prefix then arrows or h/j/k/l to move; prefix then H/J/K/L to resize.
bind Left  select-pane -L
bind Down  select-pane -D
bind Up    select-pane -U
bind Right select-pane -R
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- quality of life -------------------------------------------------------
set -g mouse on                 # click panes, drag borders to resize, scroll
set -g history-limit 20000      # generous scrollback
set -g base-index 1             # windows start at 1
setw -g pane-base-index 1       # panes start at 1
set -g renumber-windows on
set -g escape-time 10
set -g default-terminal "tmux-256color"
bind r source-file /etc/tmux.conf \; display "tmux config reloaded"

# --- Sysible-green branding ------------------------------------------------
set -g status-style "bg=#0d1b12,fg=#8fe3a8"
set -g status-left "#[bg=#1f9d55,fg=#08130c,bold] SYSIBLE #[bg=#0d1b12,fg=#8fe3a8,nobold] #S "
set -g status-left-length 32
set -g status-right "#[fg=#8fe3a8]#H #[fg=#4ec07a]%Y-%m-%d %H:%M "
set -g status-right-length 40
setw -g window-status-current-style "bg=#1f9d55,fg=#08130c,bold"
setw -g window-status-style "fg=#8fe3a8"
set -g pane-active-border-style "fg=#1f9d55"
set -g pane-border-style "fg=#2a3446"
set -g message-style "bg=#1f9d55,fg=#08130c"
