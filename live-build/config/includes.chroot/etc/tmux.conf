# Sysible Server — split-terminal defaults (tmux).
#
# tmux is the headless split terminal on Sysible Server (no GUI, so no SysTerm).
# It is auto-started for interactive logins (see /etc/profile.d/sysible-tmux.sh),
# so the split keys below are live the moment you log in — no "run tmux first".
#
#   Split keys (ROOT table, no prefix) — work over SSH AND at the raw console:
#   Ctrl+F1 → split left/right     Ctrl+F2 → split top/bottom     Ctrl+F4 → close pane
#   At the raw console the plain function keys ALSO split, as a single-key fallback:
#   F2 → split left/right          F3 → split top/bottom          F4 → close pane
#   (Ctrl+F1/F2/F4 reach the console too via the boot keymap — see below.)
#
# These are ROOT-table bindings (no prefix needed). For everything else the
# PREFIX is Ctrl+a (reliable across the console and every SSH client), e.g.
# Ctrl+a then arrows to move between panes.
#
# WHY TWO SETS OF KEYS: the Linux VIRTUAL CONSOLE (a physical/VM login at the
# getty, not SSH) natively cannot deliver Ctrl+Fn to applications — the kernel
# keyboard driver doesn't implement the modified-key (CSI-u) protocol, so Ctrl+F1
# is indistinguishable from F1 and `bind -n C-F1` would never fire there. Sysible
# Server fixes THAT with a console keymap (/usr/share/sysible/console-splitkeys.kmap,
# loaded at boot by sysible-console-splitkeys.service) that makes Ctrl+F1/F2/F4
# EMIT the very xterm sequences tmux binds below — so Ctrl+F1 now works at the raw
# console too, not only over SSH. We still ALSO bind plain F2/F3/F4 (which the VT
# delivers unaided) as a belt-and-suspenders single-key split. (F1 is left alone
# since many tools use it for help.) The Ctrl+a prefix + | / - is the universal
# fallback that works on any terminal.

# --- make modified keys (Ctrl+F1 …) reach tmux -----------------------------
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'tmux*:extkeys'
set -as terminal-features 'screen*:extkeys'

# --- one-key splits (NO prefix) --------------------------------------------
# New panes open in the current pane's directory.
# SSH from a modern terminal — Ctrl+F1/F2/F4 (need extended-keys, set above):
bind -n C-F1 split-window -h -c "#{pane_current_path}"
bind -n C-F2 split-window -v -c "#{pane_current_path}"
bind -n C-F4 kill-pane
# Raw Linux console (getty) — plain function keys, which the VT DOES deliver:
bind -n F2 split-window -h -c "#{pane_current_path}"
bind -n F3 split-window -v -c "#{pane_current_path}"
bind -n F4 kill-pane

# --- prefix: Ctrl+a (for pane moves/resize and everything else) ------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Prefix-based splits still work too (habit / terminals without extended keys):
#   Ctrl+a then |   → split left/right
#   Ctrl+a then -   → split top/bottom
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# --- move / resize panes ---------------------------------------------------
# Prefix then arrows or h/j/k/l to move; prefix then H/J/K/L to resize.
bind Left  select-pane -L
bind Down  select-pane -D
bind Up    select-pane -U
bind Right select-pane -R
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- quality of life -------------------------------------------------------
set -g mouse on                 # click panes, drag borders to resize, scroll
set -g history-limit 20000      # generous scrollback
set -g base-index 1             # windows start at 1
setw -g pane-base-index 1       # panes start at 1
set -g renumber-windows on
set -g escape-time 10
set -g default-terminal "tmux-256color"
bind r source-file /etc/tmux.conf \; display "tmux config reloaded"

# --- Sysible-green branding ------------------------------------------------
set -g status-style "bg=#0d1b12,fg=#8fe3a8"
set -g status-left "#[bg=#1f9d55,fg=#08130c,bold] SYSIBLE #[bg=#0d1b12,fg=#8fe3a8,nobold] #S "
set -g status-left-length 32
set -g status-right "#[fg=#8fe3a8]#H #[fg=#4ec07a]%Y-%m-%d %H:%M "
set -g status-right-length 40
setw -g window-status-current-style "bg=#1f9d55,fg=#08130c,bold"
setw -g window-status-style "fg=#8fe3a8"
set -g pane-active-border-style "fg=#1f9d55"
set -g pane-border-style "fg=#2a3446"
set -g message-style "bg=#1f9d55,fg=#08130c"
