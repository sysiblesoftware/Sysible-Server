#### Sysible Server — Debian Installer defaults ############################
#
# Loaded by the installer via the kernel arg  file=/cdrom/preseed.cfg  (set in
# auto/config's --bootappend-install). It ships on the ISO root because it lives
# in config/includes.binary/, which live-build copies into the binary image, so
# it is reachable at /cdrom/preseed.cfg once the installer mounts the media.
#
# Purpose: make the installed system's identity Sysible-oriented by default —
# hostname and the first user — instead of Debian's generic "debian" defaults.
#
# SECURITY: this file deliberately preseeds NO password. The installer still
# prompts for the user's password interactively, so no credential is baked into
# the image (matches Sysible's "no default credentials" hardening). Root login
# is disabled; the first user administers via sudo.
###########################################################################

### Hostname / network identity
# Pre-fill the hostname field with 'sysible-server' but STILL SHOW the prompt so
# the operator can change it per machine. Preseeding netcfg/get_hostname sets the
# value; 'seen false' resets its seen flag so d-i re-displays the question with
# that value as the EDITABLE default. Without this, an unset hostname falls back
# to d-i's built-in 'debian' default (what the installer was showing), and a
# plain preseed (no 'seen false') would skip the prompt entirely.
d-i netcfg/get_hostname   string sysible-server
d-i netcfg/get_hostname   seen false
# Belt-and-suspenders: on the rare netcfg path that reads netcfg/hostname, give it
# the same value so the fallback is never 'debian'.
d-i netcfg/hostname       string sysible-server
d-i netcfg/get_domain     string

### Accounts
# No root password -> root account locked; the first user gets sudo. (Password
# is intentionally NOT preseeded, so the installer asks for it.)
d-i passwd/root-login     boolean false
d-i passwd/user-fullname  string Sysible Administrator
d-i passwd/username       string sysible

### Clock
d-i clock-setup/utc       boolean true

### Optional / licensed software — ASKED DURING INSTALL, BEFORE THE BASE SYSTEM.
# early_command runs right after this preseed is read, before partitioning and
# the base-installer, so the operator is asked which optional tools to add up
# front (not after boot). sysible-ask-tools shows a debconf multiselect and
# stashes the answer in the installer ramdisk at /tmp/sysible-tools.wanted; the
# late_command below copies it into the target, and sysible-tools-firstboot.service
# installs the picks on first boot. The script never fails the install — if it is
# skipped for any reason nothing is preselected and `sysible-tools` still works
# on-demand after boot. Both files ship on the ISO root (config/includes.binary/).
#
# `|| true` is the belt-and-suspenders that makes this early_command NON-FATAL no
# matter what: even if /cdrom/sysible-ask-tools is somehow missing (sh exits 2,
# "can't open") or errors, d-i must NOT abort the install with "Failed to run
# preseeded command" over an OPTIONAL tools prompt. The script is also internally
# guarded and exits 0, so this is a second, unconditional safety net.
d-i preseed/early_command string sh /cdrom/sysible-ask-tools || true

### UEFI bootloader — ALSO install to the removable-media fallback path.
# THIS IS THE FIX FOR "black screen, no GRUB menu" AFTER INSTALL.
#
# By default grub-installer writes only the vendor path (\EFI\debian\grubx64.efi)
# and relies on an NVRAM boot entry pointing at it. Many hypervisors — VMware
# Fusion/Workstation especially — do not persist or honour that NVRAM entry, so
# on the first boot the firmware finds NO bootloader at all: no GRUB menu, just a
# dead black screen (the mouse pointer you see is the host's, over an un-driven
# guest display). It is not a graphics problem.
#
# Reproduced and fixed in a UEFI+VMware-SVGA VM: with only the vendor path the
# firmware reports 'failed to load Boot0001 ... Not Found' and falls through to
# PXE; with the fallback path present it reports 'starting Boot0001' and GRUB
# runs. Setting this makes grub-installer additionally write
# \EFI\BOOT\BOOTX64.EFI (the removable-media path every UEFI implementation
# checks unconditionally), so the installed system boots regardless of NVRAM.
d-i grub-installer/force-efi-extra-removable boolean true

# BIOS/legacy: answer grub-installer's own questions so it actually writes the
# MBR instead of stopping on a prompt — install GRUB to the default disk, and
# don't skip it just because another OS was detected.
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

### GUARANTEE A BOOTLOADER — BOTH FIRMWARE MODES.
# This is the "flashing cursor / no GRUB menu after install" fix, and it covers
# the two distinct ways the installed system can end up with nothing to boot:
#
# BIOS/legacy (the case that produced the flashing cursor): grub-installer wants
#   to apt-install the `grub-pc` METApackage, which is not in this offline image
#   (we ship grub-pc-bin, and grub-pc conflicts with the grub-efi-amd64 we need
#   for UEFI installs, so both cannot be installed). When that apt-install fails
#   nothing is written to the MBR, BIOS prints "Booting from Hard Disk..." and
#   stops at a blinking cursor. Reproduced in a SeaBIOS VM, and cured by running
#   grub-install --target=i386-pc, which needs ONLY grub-pc-bin + grub-common —
#   both already on the target (MBR boot code went 4 -> 329 bytes, and the VM
#   then booted GRUB and the kernel).
#
# UEFI: also drop the bootloader at the removable-media path, because many
#   hypervisors (VMware especially) do not persist the NVRAM entry that points at
#   the vendor path — verified in an OVMF VM: vendor-only gives "failed to load
#   Boot0001 ... Not Found", with the fallback it reports "starting Boot0001".
#
# HARDENING (this is the fix for "installs, then dies / won't boot" on a BIOS VM):
#   * Before running grub-install, EXPLICITLY apt-get the grub binaries into the
#     target from the CD pool (grub-pc-bin for BIOS; grub-efi-<arch>-bin for UEFI,
#     plus grub-common/grub2-common). The old command assumed they were already
#     present, but on a debootstrap-style install they may not be — and grub-install
#     then fails SILENTLY (output was sent to /dev/null), leaving an empty MBR.
#   * UEFI now uses `grub-install --removable` to write the fallback path directly,
#     not just copy an existing grubx64.efi.
#   * All output is appended to /var/log/sysible-bootloader.log ON THE INSTALLED
#     SYSTEM, so if it still won't boot you can mount the disk (or use the live
#     ISO) and read exactly what happened instead of guessing.
# Everything is guarded and the command always exits 0, so it can never fail an
# otherwise-good installation.
d-i preseed/late_command string \
    mkdir -p /target/etc/sysible; \
    cp /tmp/sysible-tools.wanted /target/etc/sysible/tools.wanted 2>/dev/null || true; \
    in-target sh -c 'L=/var/log/sysible-bootloader.log; exec >>"$L" 2>&1; \
      echo "=== sysible bootloader install: $(date -u 2>/dev/null) ==="; \
      if [ -d /sys/firmware/efi ]; then \
        echo "firmware: UEFI"; \
        case "$(uname -m)" in \
          aarch64) T=arm64-efi; B=BOOTAA64.EFI; V=grubaa64.efi; PKG=grub-efi-arm64-bin ;; \
          *)       T=x86_64-efi; B=BOOTX64.EFI; V=grubx64.efi; PKG=grub-efi-amd64-bin ;; \
        esac; \
        apt-get install -y "$PKG" grub-common grub2-common || true; \
        grub-install --target="$T" --efi-directory=/boot/efi --removable --recheck || \
          grub-install --target="$T" --efi-directory=/boot/efi --bootloader-id=debian --recheck || true; \
        if [ -f "/boot/efi/EFI/debian/$V" ]; then mkdir -p /boot/efi/EFI/BOOT; cp -f "/boot/efi/EFI/debian/$V" "/boot/efi/EFI/BOOT/$B"; fi; \
        update-grub || true; \
      else \
        echo "firmware: BIOS/legacy"; \
        apt-get install -y grub-pc-bin grub-common grub2-common || true; \
        disk=$(grub-probe --target=disk /boot 2>/dev/null || grub-probe --target=disk / 2>/dev/null); \
        echo "target disk: [$disk]"; \
        case "$disk" in \
          /dev/*) grub-install --target=i386-pc --recheck "$disk" || true; update-grub || true ;; \
          *) echo "WARNING: could not determine the target disk for grub-install" ;; \
        esac; \
      fi; \
      echo "ensuring /opt is present and root-writable on the installed system"; \
      mkdir -p /opt && chown root:root /opt && chmod 0755 /opt; ls -ld /opt; \
      echo "grub.cfg entries:"; ls -la /boot/grub/grub.cfg 2>/dev/null; \
      echo "=== bootloader install done ==="' || true; true
