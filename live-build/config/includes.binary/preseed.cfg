#### Sysible Server — Debian Installer defaults ############################
#
# Loaded by the installer via the kernel arg  file=/cdrom/preseed.cfg  (set in
# auto/config's --bootappend-install). It ships on the ISO root because it lives
# in config/includes.binary/, which live-build copies into the binary image, so
# it is reachable at /cdrom/preseed.cfg once the installer mounts the media.
#
# Purpose: make the installed system's identity Sysible-oriented by default —
# hostname and the first user — instead of Debian's generic "debian" defaults.
#
# SECURITY: this file deliberately preseeds NO password. The installer still
# prompts for the user's password interactively, so no credential is baked into
# the image (matches Sysible's "no default credentials" hardening). Root login
# is disabled; the first user administers via sudo.
###########################################################################

### Hostname / network identity
# Server images get a stable Sysible-oriented hostname by default. Rename after
# install with `hostnamectl set-hostname <name>` if desired.
d-i netcfg/get_hostname   string sysible-server
d-i netcfg/get_domain     string

### Accounts
# No root password -> root account locked; the first user gets sudo. (Password
# is intentionally NOT preseeded, so the installer asks for it.)
d-i passwd/root-login     boolean false
d-i passwd/user-fullname  string Sysible Administrator
d-i passwd/username       string sysible

### Clock
d-i clock-setup/utc       boolean true

### UEFI bootloader — ALSO install to the removable-media fallback path.
# THIS IS THE FIX FOR "black screen, no GRUB menu" AFTER INSTALL.
#
# By default grub-installer writes only the vendor path (\EFI\debian\grubx64.efi)
# and relies on an NVRAM boot entry pointing at it. Many hypervisors — VMware
# Fusion/Workstation especially — do not persist or honour that NVRAM entry, so
# on the first boot the firmware finds NO bootloader at all: no GRUB menu, just a
# dead black screen (the mouse pointer you see is the host's, over an un-driven
# guest display). It is not a graphics problem.
#
# Reproduced and fixed in a UEFI+VMware-SVGA VM: with only the vendor path the
# firmware reports 'failed to load Boot0001 ... Not Found' and falls through to
# PXE; with the fallback path present it reports 'starting Boot0001' and GRUB
# runs. Setting this makes grub-installer additionally write
# \EFI\BOOT\BOOTX64.EFI (the removable-media path every UEFI implementation
# checks unconditionally), so the installed system boots regardless of NVRAM.
d-i grub-installer/force-efi-extra-removable boolean true

# Belt-and-braces: if for any reason the debconf answer above doesn't take (a
# grub-installer version that skips the question, a manual/expert install that
# overrides it), copy the vendor bootloader to the removable path directly at the
# end of the install. Guarded and always true-exiting, so it can never fail an
# otherwise-good installation.
d-i preseed/late_command string \
    if [ -d /target/boot/efi/EFI ]; then \
      in-target sh -c 'set -e; \
        src=""; \
        for c in /boot/efi/EFI/debian/grubx64.efi /boot/efi/EFI/debian/grubaa64.efi; do \
          [ -f "$c" ] && src="$c"; \
        done; \
        if [ -n "$src" ]; then \
          mkdir -p /boot/efi/EFI/BOOT; \
          case "$src" in *aa64*) dst=/boot/efi/EFI/BOOT/BOOTAA64.EFI ;; *) dst=/boot/efi/EFI/BOOT/BOOTX64.EFI ;; esac; \
          [ -f "$dst" ] || cp -f "$src" "$dst"; \
        fi' || true; \
    fi; true
